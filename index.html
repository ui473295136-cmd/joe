<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6078"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>2026 国庆川西反穿｜四人实时自驾系统</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#073b55}.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#2b8d8f 0,transparent 34%),linear-gradient(135deg,#062f45,#0a6076 58%,#197b82);color:#fff}.box{width:min(500px,100%);border:1px solid #ffffff31;background:#ffffff12;backdrop-filter:blur(14px);border-radius:26px;padding:23px;box-shadow:0 28px 70px #001a2866}.eyebrow{font-size:10px;letter-spacing:.16em;color:#a5f1d4;font-weight:900}.box h1{font-size:30px;line-height:1.12;margin:9px 0}.box p{font-size:12px;line-height:1.65;color:#cce0e5;margin:0 0 16px}.people{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px solid #ffffff2f;background:#ffffff0d;color:#fff;border-radius:15px;padding:14px;text-align:left;font-weight:900;font-size:16px}.person span{display:block;color:#b9d5dd;font-size:9px;font-weight:600;margin-top:4px}.foot{font-size:9px;color:#a9c4cc;margin-top:13px;line-height:1.6}.loading{position:fixed;inset:0;display:none;place-items:center;background:#073b55;color:#fff;font-size:12px}.loading.show{display:grid}</style></head><body><div class="gate"><div class="box"><div class="eyebrow">2026 · 川西反穿 · 四人实时自驾系统</div><h1>先告诉我，你是谁？</h1><p>选择自己的名字后进入专属页面。位置、账本、照片、昵称和头像会按你的身份同步。</p><div class="people"><button class="person" data-name="瑞子">瑞子<span>酒店 / 账本</span></button><button class="person" data-name="航子">航子<span>机票 / 航班</span></button><button class="person" data-name="普子">普子<span>攻略 / 路况</span></button><button class="person" data-name="辉子">辉子<span>租车 / 车务</span></button></div><div class="foot">网页已改为轻量单页模式：地图只在需要时加载，不再一打开就初始化两套地图。</div></div></div><div class="loading" id="loading">正在进入你的专属行程…</div><script>const TEAM=['瑞子','航子','普子','辉子'],q=new URLSearchParams(location.search);function go(n){if(!TEAM.includes(n))return;localStorage.setItem('cw-person',n);document.getElementById('loading').classList.add('show');location.replace('./app-v4.html?person='+encodeURIComponent(n))}document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>go(b.dataset.name));const p=q.get('person')||localStorage.getItem('cw-person');if(TEAM.includes(p))go(p);</script></body></html>
