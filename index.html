<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6078"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>2026 国庆川西反穿｜四人实时自驾系统</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#073b55}.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#2b8d8f 0,transparent 34%),linear-gradient(135deg,#062f45,#0a6076 58%,#197b82);color:#fff}.box{width:min(500px,100%);border:1px solid #ffffff31;background:#ffffff12;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:23px;box-shadow:0 28px 70px #001a2866}.eyebrow{font-size:11px;letter-spacing:.14em;color:#a5f1d4;font-weight:900}.box h1{font-size:30px;line-height:1.12;margin:9px 0}.box p{font-size:14px;line-height:1.65;color:#d7e8ec;margin:0 0 18px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{border:1px solid #ffffff2f;background:#ffffff0d;color:#fff;border-radius:16px;padding:16px;text-align:left;font-weight:900;font-size:18px;min-height:72px}.person:active{transform:scale(.985);background:#ffffff1a}.person span{display:block;color:#b9d5dd;font-size:12px;font-weight:600;margin-top:5px}.foot{font-size:11px;color:#b9d0d6;margin-top:14px;line-height:1.6}.loading{position:fixed;inset:0;display:none;place-items:center;background:#073b55;color:#fff;font-size:14px;z-index:10}.loading.show{display:grid}</style></head><body><div class="gate"><div class="box"><div class="eyebrow">2026 · 川西反穿 · 四人实时自驾系统</div><h1>先告诉我，你是谁？</h1><p>每次从入口进入都先选择自己的名字。选择后进入专属页面；普通成员进入后不能再切换身份。</p><div class="people"><button class="person" data-name="瑞子">瑞子<span>酒店 / 账本 · 管理员</span></button><button class="person" data-name="航子">航子<span>机票 / 航班</span></button><button class="person" data-name="普子">普子<span>攻略 / 路况</span></button><button class="person" data-name="辉子">辉子<span>租车 / 车务</span></button></div><div class="foot">瑞子拥有管理员身份切换权限；其他成员进入后只使用自己的页面。</div></div></div><div class="loading" id="loading">正在进入你的专属行程…</div><script>const TEAM=['瑞子','航子','普子','辉子'];function go(n){if(!TEAM.includes(n))return;localStorage.setItem('cw-person',n);sessionStorage.setItem('cw-admin',n==='瑞子'?'1':'0');sessionStorage.setItem('cw-entry-person',n);document.getElementById('loading').classList.add('show');location.replace('./app-v4.html?person='+encodeURIComponent(n))}document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>go(b.dataset.name));</script></body></html>
