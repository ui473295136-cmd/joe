<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b6078" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>2026 国庆川西反穿｜四人实时自驾系统</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: #073b55;
      }
      .gate {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at 80% 10%, #2b8d8f 0, transparent 34%),
          linear-gradient(135deg, #062f45, #0a6076 58%, #197b82);
        color: #fff;
      }
      .box {
        width: min(500px, 100%);
        border: 1px solid #ffffff31;
        background: #ffffff12;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 26px;
        padding: 23px;
        box-shadow: 0 28px 70px #001a2866;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #a5f1d4;
        font-weight: 900;
      }
      .box h1 {
        font-size: 30px;
        line-height: 1.12;
        margin: 9px 0;
      }
      .box p {
        font-size: 13px;
        line-height: 1.65;
        color: #cce0e5;
        margin: 0 0 16px;
      }
      .people {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .person {
        border: 1px solid #ffffff2f;
        background: #ffffff0d;
        color: #fff;
        border-radius: 16px;
        padding: 15px;
        text-align: left;
        font-weight: 900;
        font-size: 17px;
        min-height: 72px;
      }
      .person:active {
        transform: scale(0.985);
      }
      .person span {
        display: block;
        color: #b9d5dd;
        font-size: 11px;
        font-weight: 600;
        margin-top: 5px;
      }
      .foot {
        font-size: 11px;
        color: #a9c4cc;
        margin-top: 14px;
        line-height: 1.6;
      }
      .auth-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: #031e2bbd;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .auth-overlay.show {
        display: flex;
      }
      .auth-card {
        width: min(390px, 100%);
        background: #f8fcfd;
        color: #173f50;
        border: 1px solid #ffffffb8;
        border-radius: 26px;
        padding: 20px;
        box-shadow: 0 30px 80px #00172380;
      }
      .auth-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .auth-head span {
        font-size: 12px;
        color: #6c838d;
      }
      .auth-head h2 {
        font-size: 24px;
        margin: 3px 0 0;
      }
      .auth-cancel {
        border: 0;
        background: #e7f0f2;
        color: #355967;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 22px;
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 24px 0 12px;
      }
      .dotpin {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #8ca4ad;
        background: #fff;
      }
      .dotpin.on {
        background: #0b6078;
        border-color: #0b6078;
      }
      .auth-msg {
        min-height: 42px;
        text-align: center;
        color: #6f858e;
        font-size: 13px;
        line-height: 1.45;
      }
      .auth-msg.error {
        color: #c23d34;
        font-weight: 800;
      }
      .auth-msg.lock {
        color: #a65c12;
        font-weight: 800;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
      .keypad button {
        min-height: 58px;
        border: 0;
        border-radius: 16px;
        background: #edf4f5;
        color: #173f50;
        font-size: 22px;
        font-weight: 800;
      }
      .keypad button:active {
        background: #dcebed;
      }
      .keypad button:disabled {
        opacity: 0.35;
      }
      .keypad .blank {
        visibility: hidden;
      }
      .setup-actions {
        display: none;
        grid-template-columns: 1fr 1.4fr;
        gap: 10px;
        margin-top: 14px;
      }
      .setup-actions.show {
        display: grid;
      }
      .setup-actions button {
        min-height: 48px;
        border-radius: 14px;
        border: 1px solid #d4e2e6;
        background: #fff;
        color: #315563;
        font-weight: 900;
        font-size: 14px;
      }
      .setup-actions .confirm {
        background: #0b6078;
        color: #fff;
        border-color: #0b6078;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        place-items: center;
        background: #073b55;
        color: #fff;
        font-size: 13px;
      }
      .loading.show {
        display: grid;
      }
      @media (max-width: 480px) {
        .box {
          padding: 21px;
        }
        .box h1 {
          font-size: 28px;
        }
        .auth-card {
          padding: 18px;
        }
        .keypad button {
          min-height: 56px;
        }
      }
      .pin-label {
        display: block;
        margin-top: 18px;
        font-size: 13px;
        color: #536c77;
      }
      #pinInput {
        width: 100%;
        min-height: 48px;
        border: 1px solid #a7bec6;
        border-radius: 12px;
        margin-top: 7px;
        font: 24px monospace;
        letter-spacing: 18px;
        text-align: center;
        color: #173f50;
        background: #fff;
      }
      .dots {
        display: none;
      }
      .remember-device {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        line-height: 1.5;
        margin: 14px 0 0;
        min-height: 44px;
      }
      .remember-device input {
        width: 20px;
        height: 20px;
        accent-color: #0b6078;
      }
      .auth-card {
        max-height: calc(100dvh - 32px);
        overflow: auto;
        overscroll-behavior: contain;
      }
      .auth-cancel {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
      }
      #authRetry {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        margin-top: 10px;
        background: #0b6078;
        color: #fff;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #38b4c4;
        outline-offset: 3px;
      }
      button:disabled {
        cursor: wait;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-height: 720px) {
        .keypad button {
          min-height: 42px;
        }
        .keypad {
          gap: 6px;
        }
        .auth-card {
          padding: 14px;
        }
        .auth-msg {
          min-height: 32px;
        }
        .remember-device {
          margin-top: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="gate">
      <div class="box">
        <div class="eyebrow">2026 · 川西反穿 · 四人实时自驾系统</div>
        <h1>先告诉我，你是谁？</h1>
        <p>
          选择自己的身份，首次输入 4 位密码。记住此设备后，30
          天内再次打开可自动进入。
        </p>
        <div class="people">
          <button class="person" data-name="瑞子">
            瑞子<span>酒店 / 账本 · 管理员</span></button
          ><button class="person" data-name="航子">
            航子<span>机票 / 航班</span></button
          ><button class="person" data-name="普子">
            普子<span>攻略 / 路况</span></button
          ><button class="person" data-name="辉子">
            辉子<span>租车 / 车务</span>
          </button>
        </div>
        <div class="foot">
          连续输错 5 次后锁定 20
          分钟；冷却结束后如果继续输错，下一次锁定时间每次增加 10 分钟。
        </div>
      </div>
    </div>
    <div
      class="auth-overlay"
      id="authOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="authTitle"
      aria-hidden="true"
    >
      <div class="auth-card">
        <div class="auth-head">
          <div>
            <span id="authEyebrow">身份验证</span>
            <h2 id="authTitle">请输入密码</h2>
          </div>
          <button class="auth-cancel" id="authCancel" aria-label="取消">
            ×
          </button>
        </div>
        <label class="pin-label" for="pinInput">4 位数字密码</label
        ><input
          id="pinInput"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          maxlength="4"
          pattern="[0-9]{4}"
          aria-describedby="authMsg"
        />
        <div class="dots" id="pinDots" aria-hidden="true">
          <i class="dotpin"></i><i class="dotpin"></i><i class="dotpin"></i
          ><i class="dotpin"></i>
        </div>
        <div class="auth-msg" id="authMsg" role="status" aria-live="polite">
          请输入 4 位数字密码
        </div>
        <div class="keypad" id="keypad">
          <button data-key="1">1</button><button data-key="2">2</button
          ><button data-key="3">3</button><button data-key="4">4</button
          ><button data-key="5">5</button><button data-key="6">6</button
          ><button data-key="7">7</button><button data-key="8">8</button
          ><button data-key="9">9</button
          ><button class="blank" disabled></button
          ><button data-key="0">0</button><button data-key="del">⌫</button>
        </div>
        <label class="remember-device"
          ><input id="rememberDevice" type="checkbox" checked />记住此设备，30
          天内自动登录</label
        ><button type="button" id="authRetry" hidden>重新连接</button>
        <div class="setup-actions" id="setupActions">
          <button id="setupCancel">取消</button
          ><button class="confirm" id="setupConfirm">确认设置</button>
        </div>
      </div>
    </div>
    <div class="loading" id="loading">正在进入你的专属行程…</div>
    <script src="./session-store.js?v=1"></script>
    <script src="./login.js?v=1"></script>
  </body>
</html>
