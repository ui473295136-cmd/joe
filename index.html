<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6078"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>2026 国庆川西反穿｜四人实时自驾系统</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#073b55}.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#2b8d8f 0,transparent 34%),linear-gradient(135deg,#062f45,#0a6076 58%,#197b82);color:#fff}.box{width:min(500px,100%);border:1px solid #ffffff31;background:#ffffff12;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:23px;box-shadow:0 28px 70px #001a2866}.eyebrow{font-size:11px;letter-spacing:.14em;color:#a5f1d4;font-weight:900}.box h1{font-size:30px;line-height:1.12;margin:9px 0}.box p{font-size:13px;line-height:1.65;color:#cce0e5;margin:0 0 16px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{border:1px solid #ffffff2f;background:#ffffff0d;color:#fff;border-radius:16px;padding:15px;text-align:left;font-weight:900;font-size:17px;min-height:72px}.person:active{transform:scale(.985)}.person span{display:block;color:#b9d5dd;font-size:11px;font-weight:600;margin-top:5px}.foot{font-size:11px;color:#a9c4cc;margin-top:14px;line-height:1.6}.auth-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#031e2bbd;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.auth-overlay.show{display:flex}.auth-card{width:min(390px,100%);background:#f8fcfd;color:#173f50;border:1px solid #ffffffb8;border-radius:26px;padding:20px;box-shadow:0 30px 80px #00172380}.auth-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.auth-head span{font-size:12px;color:#6c838d}.auth-head h2{font-size:24px;margin:3px 0 0}.auth-cancel{border:0;background:#e7f0f2;color:#355967;width:38px;height:38px;border-radius:50%;font-size:22px}.dots{display:flex;justify-content:center;gap:14px;margin:24px 0 12px}.dotpin{width:16px;height:16px;border-radius:50%;border:2px solid #8ca4ad;background:#fff}.dotpin.on{background:#0b6078;border-color:#0b6078}.auth-msg{min-height:42px;text-align:center;color:#6f858e;font-size:13px;line-height:1.45}.auth-msg.error{color:#c23d34;font-weight:800}.auth-msg.lock{color:#a65c12;font-weight:800}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.keypad button{min-height:58px;border:0;border-radius:16px;background:#edf4f5;color:#173f50;font-size:22px;font-weight:800}.keypad button:active{background:#dcebed}.keypad button:disabled{opacity:.35}.keypad .blank{visibility:hidden}.setup-actions{display:none;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}.setup-actions.show{display:grid}.setup-actions button{min-height:48px;border-radius:14px;border:1px solid #d4e2e6;background:#fff;color:#315563;font-weight:900;font-size:14px}.setup-actions .confirm{background:#0b6078;color:#fff;border-color:#0b6078}.loading{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#073b55;color:#fff;font-size:13px}.loading.show{display:grid}@media(max-width:480px){.box{padding:21px}.box h1{font-size:28px}.auth-card{padding:18px}.keypad button{min-height:56px}}</style></head><body><div class="gate"><div class="box"><div class="eyebrow">2026 · 川西反穿 · 四人实时自驾系统</div><h1>先告诉我，你是谁？</h1><p>选择自己的身份。首次进入先设置 4 位数字密码，以后每次从这里进入都要验证自己的密码。</p><div class="people"><button class="person" data-name="瑞子">瑞子<span>酒店 / 账本 · 管理员</span></button><button class="person" data-name="航子">航子<span>机票 / 航班</span></button><button class="person" data-name="普子">普子<span>攻略 / 路况</span></button><button class="person" data-name="辉子">辉子<span>租车 / 车务</span></button></div><div class="foot">连续输错 5 次后锁定 20 分钟；冷却结束后如果继续输错，下一次锁定时间每次增加 10 分钟。</div></div></div><div class="auth-overlay" id="authOverlay"><div class="auth-card"><div class="auth-head"><div><span id="authEyebrow">身份验证</span><h2 id="authTitle">请输入密码</h2></div><button class="auth-cancel" id="authCancel" aria-label="取消">×</button></div><div class="dots" id="pinDots"><i class="dotpin"></i><i class="dotpin"></i><i class="dotpin"></i><i class="dotpin"></i></div><div class="auth-msg" id="authMsg">请输入 4 位数字密码</div><div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="blank" disabled></button><button data-key="0">0</button><button data-key="del">⌫</button></div><div class="setup-actions" id="setupActions"><button id="setupCancel">取消</button><button class="confirm" id="setupConfirm">确认设置</button></div></div></div><div class="loading" id="loading">正在进入你的专属行程…</div><script>(()=>{const TEAM=['瑞子','航子','普子','辉子'],ROLE={瑞子:'酒店 / 账本',航子:'机票 / 航班',普子:'攻略 / 路况',辉子:'租车 / 车务'},AUTH='https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-auth',TRIP='chuanxi2026';const $=s=>document.querySelector(s),overlay=$('#authOverlay'),msg=$('#authMsg'),title=$('#authTitle'),eyebrow=$('#authEyebrow'),dots=[...document.querySelectorAll('.dotpin')],actions=$('#setupActions'),keys=[...document.querySelectorAll('#keypad button[data-key]')];let person='',mode='verify',pin='',first='',confirmPin='',stage=1,busy=false,lockTimer=null,lockUntil=0;async function api(action,payload){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trip_slug:TRIP,action,payload}),signal:c.signal});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'操作失败');Object.assign(e,j,{status:r.status});throw e}return j}finally{clearTimeout(t)}}function paint(){dots.forEach((d,i)=>d.classList.toggle('on',i<pin.length))}function setMessage(text,kind=''){msg.textContent=text;msg.className='auth-msg'+(kind?' '+kind:'')}function setKeys(disabled){keys.forEach(k=>k.disabled=disabled)}function resetEntry(){pin='';paint()}function closeAuth(){if(busy)return;clearInterval(lockTimer);lockTimer=null;person='';pin='';first='';confirmPin='';stage=1;overlay.classList.remove('show');actions.classList.remove('show');setKeys(false)}function countdown(sec){lockUntil=Date.now()+sec*1000;setKeys(true);actions.classList.remove('show');clearInterval(lockTimer);const tick=()=>{const left=Math.max(0,Math.ceil((lockUntil-Date.now())/1000));if(left<=0){clearInterval(lockTimer);lockTimer=null;setKeys(false);resetEntry();setMessage('冷却结束，可以重新输入密码');return}const m=Math.floor(left/60),s=String(left%60).padStart(2,'0');setMessage(`已锁定，请 ${m}:${s} 后再试`,'lock')};tick();lockTimer=setInterval(tick,1000)}function enter(session){sessionStorage.setItem(`cw-auth-${person}`,session.token);sessionStorage.setItem(`cw-auth-exp-${person}`,session.expires_at||'');sessionStorage.setItem('cw-admin',person==='瑞子'?'1':'0');localStorage.setItem('cw-person',person);$('#loading').classList.add('show');location.replace('./app-v4.html?person='+encodeURIComponent(person))}async function choose(p){if(!TEAM.includes(p)||busy)return;person=p;mode='verify';stage=1;pin='';first='';confirmPin='';paint();actions.classList.remove('show');eyebrow.textContent=`${p} · ${ROLE[p]}`;title.textContent='正在检查密码状态';setMessage('请稍候…');overlay.classList.add('show');setKeys(true);busy=true;try{const st=await api('status',{person:p});if(st.locked){title.textContent='暂时无法进入';countdown(st.lock_seconds);return}mode=st.configured?'verify':'setup';title.textContent=mode==='verify'?'请输入 4 位密码':'首次进入 · 设置密码';setMessage(mode==='verify'?`还有 ${Math.max(0,st.remaining_attempts??5)} 次机会`:'请输入新的 4 位数字密码');setKeys(false)}catch(e){setMessage('密码服务暂时无法连接，请稍后重试','error');setKeys(true)}finally{busy=false}}async function submitVerify(){if(busy||pin.length!==4)return;busy=true;setKeys(true);setMessage('正在验证…');const typed=pin;try{const r=await api('verify',{person,pin:typed});enter(r)}catch(e){resetEntry();if(e.code==='locked'){title.textContent='暂时无法进入';countdown(e.lock_seconds||1200)}else{setMessage(`密码错误，还剩 ${Math.max(0,e.remaining_attempts??0)} 次机会`,'error');setKeys(false)}}finally{busy=false}}function setupDigitDone(){if(stage===1){first=pin;pin='';stage=2;paint();title.textContent='再次输入密码';setMessage('请重复输入刚才的 4 位密码');return}confirmPin=pin;pin='';paint();if(first!==confirmPin){stage=1;first='';confirmPin='';title.textContent='首次进入 · 设置密码';setMessage('两次密码不一致，请重新设置','error');return}title.textContent='确认设置密码';setMessage('确认后才会保存。点击取消不会写入任何密码。');setKeys(true);actions.classList.add('show')}async function confirmSetup(){if(busy||!/^\d{4}$/.test(first)||first!==confirmPin)return;busy=true;actions.querySelectorAll('button').forEach(b=>b.disabled=true);setMessage('正在安全保存密码…');try{const r=await api('setup',{person,pin:first,confirm_pin:confirmPin});enter(r)}catch(e){setMessage(e.message||'设置失败，请重试','error');actions.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{busy=false}}function key(k){if(busy||lockTimer||actions.classList.contains('show'))return;if(k==='del'){pin=pin.slice(0,-1);paint();return}if(!/^\d$/.test(k)||pin.length>=4)return;pin+=k;paint();if(pin.length===4)setTimeout(()=>mode==='verify'?submitVerify():setupDigitDone(),90)}document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>choose(b.dataset.name));$('#keypad').onclick=e=>{const b=e.target.closest('button[data-key]');if(b)key(b.dataset.key)};$('#authCancel').onclick=closeAuth;$('#setupCancel').onclick=closeAuth;$('#setupConfirm').onclick=confirmSetup;document.addEventListener('keydown',e=>{if(!overlay.classList.contains('show'))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Escape')closeAuth()});const q=new URLSearchParams(location.search),p=q.get('person');if(TEAM.includes(p))setTimeout(()=>choose(p),180)})();</script></body></html>
