<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b55"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="川西自驾"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>2026 国庆川西反穿｜四人实时自驾系统</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#073b55;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}iframe{border:0;width:100%;height:100%;display:none;background:#f3f8f8}.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 82% 12%,#2b8d8f 0,transparent 34%),linear-gradient(135deg,#062f45,#0a6076 58%,#197b82);color:#fff}.gate.hide{display:none}.box{width:min(520px,100%);background:#ffffff12;border:1px solid #ffffff30;backdrop-filter:blur(16px);border-radius:28px;padding:25px;box-shadow:0 30px 80px #001a2866}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a5f1d4;font-weight:900}.box h1{font-size:32px;line-height:1.08;margin:10px 0}.box p{font-size:13px;line-height:1.7;color:#cce0e5;margin:0 0 18px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{border:1px solid #ffffff2f;background:#ffffff0d;color:#fff;border-radius:16px;padding:15px;text-align:left;font-weight:900;font-size:16px}.person span{display:block;color:#b9d5dd;font-size:10px;font-weight:600;margin-top:4px}.person:active{transform:scale(.99)}.other{display:flex;gap:8px;margin-top:12px}.other input{flex:1;min-width:0;border:1px solid #ffffff32;background:#ffffff12;color:#fff;border-radius:13px;padding:12px 13px;outline:none}.other input::placeholder{color:#c4d6dc}.other button{border:0;border-radius:13px;background:#a5f1d4;color:#06485f;font-weight:900;padding:0 16px}.foot{font-size:10px;color:#a9c4cc;margin-top:14px;line-height:1.6}</style></head><body><div class="gate" id="gate"><div class="box"><div class="eyebrow">2026 · 川西反穿 · 四人实时自驾系统</div><h1>先告诉我，你是谁？</h1><p>第一次打开网页先选择自己的名字。之后网页会自动切换成与你匹配的内容；从 iPhone 桌面小组件进入时，也会直接进入你的专属页面。</p><div class="people"><button class="person" data-name="瑞子">瑞子<span>酒店 / 账本</span></button><button class="person" data-name="航子">航子<span>机票</span></button><button class="person" data-name="普子">普子<span>攻略</span></button><button class="person" data-name="辉子">辉子<span>租车 / 车务</span></button></div><div class="other"><input id="nameInput" placeholder="也可以输入：瑞子 / 航子 / 普子 / 辉子"><button id="go">进入</button></div><div class="foot">身份只保存在这台 iPhone 上，可随时在网页里切换。精确位置、AA账本等私密数据仍需要旅行 PIN。</div></div></div><iframe id="app" allow="geolocation; clipboard-write; fullscreen"></iframe><script>const ALLOWED=['瑞子','航子','普子','辉子'];const qs=new URLSearchParams(location.search);let me=qs.get('person')||localStorage.getItem('cw-person')||'';if(ALLOWED.includes(me))localStorage.setItem('cw-person',me);else me='';const gate=document.getElementById('gate'),app=document.getElementById('app');function enter(name){name=(name||'').trim();if(!ALLOWED.includes(name)){alert('请输入：瑞子、航子、普子或辉子');return}me=name;localStorage.setItem('cw-person',me);document.title=me+'的川西自驾｜2026';gate.classList.add('hide');app.style.display='block';const fromWidget=qs.get('widget')==='1'?'&widget=1':'';app.src='./dashboard.html?person='+encodeURIComponent(me)+fromWidget}document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>enter(b.dataset.name));document.getElementById('go').onclick=()=>enter(document.getElementById('nameInput').value);document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')enter(e.target.value)});app.addEventListener('load',()=>{const d=app.contentDocument;if(!d)return;for(const src of ['./avatars.js?v=1','./cloud-sync.js?v=5','./ios-widget.js?v=1']){const s=d.createElement('script');s.src=src;d.body.appendChild(s)}});if(me)enter(me);</script></body></html>
