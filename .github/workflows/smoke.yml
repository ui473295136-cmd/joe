name: App smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize decision script typo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('decision-v1.js')
          s=p.read_text()
          fixed=s.replace("routeCum.at(-1)-routeCum[cur.index))","routeCum.at(-1)-routeCum[cur.index])")
          p.write_text(fixed)
          PY
          if ! git diff --quiet -- decision-v1.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add decision-v1.js
            git commit -m 'Fix decision route summary syntax'
            git push origin HEAD:main
          fi
      - name: JavaScript syntax
        run: |
          node --check app-v4.js
          node --check geo-throttle.js
          node --check decision-v1.js
      - name: Required files and links
        shell: bash
        run: |
          test -s index.html
          test -s app-v4.html
          test -s app-v4.css
          test -s app-v4.js
          test -s geo-throttle.js
          test -s decision-v1.js
          test -s decision-v1.css
          test -s avatars.js
          grep -q 'app-v4.html' index.html
          grep -q 'app-v4.js' app-v4.html
          grep -q 'app-v4.css' app-v4.html
          grep -q 'geo-throttle.js' app-v4.html
          grep -q 'decision-v1.js' geo-throttle.js
          grep -q 'decision-v1.css' geo-throttle.js
          ! grep -q 'dashboard.html' index.html
          ! grep -q 'leaflet' index.html
          ! grep -q 'road-routes.json' index.html
          ! grep -q 'dashboard.html' app-v4.html
          ! grep -q 'precision-map-profile' app-v4.html
      - name: Headless browser startup
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/cw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome binary not present; static and syntax checks already passed.'
            exit 0
          fi
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/app-v4.html?person=%E7%91%9E%E5%AD%90' >/tmp/cw-dom.html 2>/tmp/cw-chrome.log || true
          grep -q '3秒关键信息' /tmp/cw-dom.html
          grep -q 'id="bottomNav"' /tmp/cw-dom.html
          grep -q 'id="mapOverlay"' /tmp/cw-dom.html
          grep -q 'id="decisionHub"' /tmp/cw-dom.html
          grep -q 'id="unreadControl"' /tmp/cw-dom.html
          ! grep -q '地图正在加载，请稍后重试' /tmp/cw-dom.html
