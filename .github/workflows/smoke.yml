name: App smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check app-v4.js
          node --check geo-throttle.js
          node --check decision-v1.js
          node --check map-v5.js
          node --check qa-probe.js
      - name: Required files and links
        shell: bash
        run: |
          test -s index.html
          test -s app-v4.html
          test -s app-v4.css
          test -s app-v4.js
          test -s geo-throttle.js
          test -s decision-v1.js
          test -s decision-v1.css
          test -s map-v5.js
          test -s map-v5.css
          test -s ux-v5.css
          test -s qa-probe.js
          test -s avatars.js
          grep -q 'app-v4.html' index.html
          grep -q 'app-v4.js' app-v4.html
          grep -q 'map-v5.js' app-v4.html
          grep -q 'map-v5.css' app-v4.html
          grep -q 'ux-v5.css' app-v4.html
          grep -q 'qa-probe.js' app-v4.html
          grep -q 'decision-v1.js' geo-throttle.js
          ! grep -q 'dashboard.html' index.html
          ! grep -q 'dashboard.html' app-v4.html
          ! grep -q 'precision-map-profile' app-v4.html
          grep -q 'data-view="me".*navBadge' app-v4.html
      - name: Four identity browser QA
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/cw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome binary not present; static and syntax checks already passed.'
            exit 0
          fi
          for SPEC in '瑞子|%E7%91%9E%E5%AD%90' '航子|%E8%88%AA%E5%AD%90' '普子|%E6%99%AE%E5%AD%90' '辉子|%E8%BE%89%E5%AD%90'; do
            IFS='|' read -r NAME ENC <<< "$SPEC"
            echo "Testing $NAME"
            timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:8000/app-v4.html?person=${ENC}&qa=1" >"/tmp/cw-${NAME}.html" 2>"/tmp/cw-${NAME}.log" || true
            grep -q "QA_PASS|${NAME}|" "/tmp/cw-${NAME}.html"
            grep -q 'id="decisionHub"' "/tmp/cw-${NAME}.html"
            grep -q 'id="unreadControl"' "/tmp/cw-${NAME}.html"
            grep -q 'id="cwMapCanvas"' "/tmp/cw-${NAME}.html"
            ! grep -q '地图正在加载，请稍后重试' "/tmp/cw-${NAME}.html"
          done
