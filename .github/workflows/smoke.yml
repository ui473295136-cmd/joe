name: App smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          for f in app-v4.js guest-mode-v1.js ledger-detail-v3.js ledger-settlement-v4.js ledger-related-focus-v1.js daily-rhythm-v1.js structured-clone-compat-v1.js itinerary-admin-v1.js itinerary-dynamic-guard-v1.js sync-hub-v1.js profile-display-v1.js map-open-watchdog-v1.js auth-guard.js geo-throttle.js time-compat-v1.js driver-fun-v2.js avatar-interactions-v1.js avatar-interactions-qa-mock-v1.js qa-avatar-interactions.cjs qa-guest.cjs qa-itinerary.cjs trip-stage-v2.js stage-tag-guard-v1.js trip-stage-card-guard-v1.js itinerary-header-sync-v1.js qa-stage.js ledger-v2.js qa-ledger-v2.cjs minimal-v1.js profile-sync-v2.js profile-upload-v3.js admin-switch-v1.js ledger-ack-v1.js itinerary-live-v1.js daily-card-v1.js daily-finance-pairwise-v1.js travel-assist-v1.js travel-assist-dayfix-v1.js map-state-guard-v1.js social-v1.js social-qa-mock-v1.js map-v5.js qa-mock.js qa-probe.js qa-ci.js session-store.js login.js app-bootstrap.js offline-v1.js interaction-ux.js; do node --check "$f"; done
      - name: Required files and links
        shell: bash
        run: |
          for f in index.html app-v4.html app-v4.css app-v4.js guest-mode-v1.js ledger-detail-v3.js ledger-settlement-v4.js ledger-related-focus-v1.js daily-rhythm-v1.js structured-clone-compat-v1.js itinerary-admin-v1.js itinerary-dynamic-guard-v1.js sync-hub-v1.js profile-display-v1.js map-open-watchdog-v1.js auth-guard.js geo-throttle.js time-compat-v1.js driver-fun-v2.js driver-fun-v2.css avatar-interactions-v1.js avatar-interactions-v1.css avatar-interactions-qa-mock-v1.js qa-avatar-interactions.cjs qa-guest.cjs qa-itinerary.cjs trip-stage-v2.js trip-stage-v2.css stage-tag-guard-v1.js trip-stage-card-guard-v1.js itinerary-header-sync-v1.js qa-stage.js ledger-v2.js ledger-v2.css qa-ledger-v2.cjs minimal-v1.js minimal-v1.css profile-sync-v2.js profile-sync-v2.css profile-upload-v3.js admin-switch-v1.js ledger-ack-v1.js itinerary-live-v1.js itinerary-live-v1.css daily-card-v1.js daily-card-v1.css daily-finance-pairwise-v1.js travel-assist-v1.css travel-assist-v1.js travel-assist-dayfix-v1.js map-state-guard-v1.js social-v1.js social-v1.css social-qa-mock-v1.js map-v5.js map-v5.css qa-mock.js qa-probe.js qa-ci.js avatars.js manifest.webmanifest icon.svg sw.js road-routes.json supabase/functions/trip-auth/index.ts supabase/functions/trip-guest/index.ts supabase/functions/trip-day-summary/index.ts supabase/functions/trip-itinerary/index.ts; do test -s "$f"; done
          grep -q 'ledger-related-focus-v1.js?v=1' app-bootstrap.js
          grep -q 'daily-rhythm-v1.js?v=1' app-bootstrap.js
          grep -q 'structured-clone-compat-v1.js?v=1' app-bootstrap.js
          grep -q 'itinerary-admin-v1.js?v=1' app-bootstrap.js
          grep -q 'itinerary-dynamic-guard-v1.js?v=2' app-bootstrap.js
          grep -q 'guest-mode-v1.js?v=1' app-bootstrap.js
          grep -q 'geo-throttle.js?v=6' app-bootstrap.js
          grep -q 'trip-stage-v2.js?v=2' geo-throttle.js
          grep -q 'itinerary-header-sync-v1.js?v=2' geo-throttle.js
          grep -q 'chuanxi-2026-v59-itinerary-switch' sw.js
          grep -q 'structured-clone-compat-v1.js' sw.js
          grep -q 'itinerary-admin-v1.js' sw.js
          grep -q 'itinerary-dynamic-guard-v1.js' sw.js
          grep -q 'trip-itinerary' itinerary-admin-v1.js
          grep -q '仅瑞子管理员可修改行程' supabase/functions/trip-itinerary/index.ts
          grep -q '道路路线自动计算' supabase/functions/trip-itinerary/index.ts
          grep -q 'trip_itinerary_days' supabase/functions/trip-day-summary/index.ts
          grep -q '与我有关 · 未读' ledger-related-focus-v1.js
          grep -q '05:00' daily-rhythm-v1.js
          grep -q '20:00' daily-rhythm-v1.js
      - name: Session, API authorization and interaction regression
        run: npm ci --ignore-scripts && npm test
      - name: Production backend read checks
        shell: bash
        run: |
          for PERSON in '瑞子' '航子' '普子' '辉子'; do
            BODY=$(printf '{"trip_slug":"chuanxi2026","action":"status","payload":{"person":"%s"}}' "$PERSON")
            OUT=$(curl -fsS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-auth' -H 'content-type: application/json' --data "$BODY")
            echo "$OUT" | grep -q '"configured"'
          done
          for API in trip-profile trip-sync trip-trash; do
            STATUS=$(curl -sS --max-time 10 -o /tmp/cw-auth-check.json -w '%{http_code}' -X POST "https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/$API" -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{}}')
            test "$STATUS" = '401'
            grep -q 'session_invalid' /tmp/cw-auth-check.json
          done
          STATUS=$(curl -sS --max-time 10 -o /tmp/cw-day-invalid.json -w '%{http_code}' -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-day-summary' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid","date":"2026-10-02"}}')
          test "$STATUS" = '401'
          grep -q 'session_invalid' /tmp/cw-day-invalid.json
          STATUS=$(curl -sS --max-time 10 -o /tmp/cw-itin-invalid.json -w '%{http_code}' -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-itinerary' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}')
          test "$STATUS" = '401'
          grep -q 'session_invalid' /tmp/cw-itin-invalid.json
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-ledger' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"ack_all","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-assist' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-social' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-interaction' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          GUEST_JSON=$(curl -fsS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-auth' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"guest","payload":{}}')
          GUEST_TOKEN=$(printf '%s' "$GUEST_JSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).token')
          test -n "$GUEST_TOKEN"
          printf '%s' "$GUEST_JSON" | grep -q '"read_only":true'
          curl -fsS --max-time 12 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-auth' -H 'content-type: application/json' --data "{\"trip_slug\":\"chuanxi2026\",\"action\":\"validate\",\"payload\":{\"person\":\"访客\",\"token\":\"$GUEST_TOKEN\"}}" | grep -q '"valid":true'
          curl -fsS --max-time 15 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-guest' -H 'content-type: application/json' --data "{\"trip_slug\":\"chuanxi2026\",\"action\":\"sync_state\",\"payload\":{\"token\":\"$GUEST_TOKEN\"}}" | grep -q '"read_only":true'
          curl -fsS --max-time 15 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-day-summary' -H 'content-type: application/json' --data "{\"trip_slug\":\"chuanxi2026\",\"action\":\"state\",\"payload\":{\"person\":\"访客\",\"token\":\"$GUEST_TOKEN\",\"date\":\"2026-10-02\"}}" | grep -q '"summary"'
          curl -fsS --max-time 15 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-itinerary' -H 'content-type: application/json' --data "{\"trip_slug\":\"chuanxi2026\",\"action\":\"state\",\"payload\":{\"person\":\"访客\",\"token\":\"$GUEST_TOKEN\"}}" | grep -q '"days"'
          STATUS=$(curl -sS --max-time 10 -o /tmp/cw-guest-itin-write.json -w '%{http_code}' -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-itinerary' -H 'content-type: application/json' --data "{\"trip_slug\":\"chuanxi2026\",\"action\":\"update_day\",\"payload\":{\"person\":\"访客\",\"token\":\"$GUEST_TOKEN\",\"day_date\":\"2026-10-02\",\"points\":[]}}")
          test "$STATUS" = '403'
          grep -q 'admin_only' /tmp/cw-guest-itin-write.json
      - name: Map tile connectivity
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -A "$UA" -fL --max-time 8 -sS 'https://webrd01.is.autonavi.com/appmaptile?style=7&lang=zh_cn&size=1&scale=1&x=53990&y=24854&z=16' -o /tmp/amap.png
          A=$?
          curl -A "$UA" -fL --max-time 8 -sS 'https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/16/24854/53990' -o /tmp/geoq.png
          B=$?
          set -e
          if [ "$A" -ne 0 ] && [ "$B" -ne 0 ]; then echo 'Both map tile sources failed'; exit 1; fi
          test -s /tmp/amap.png || test -s /tmp/geoq.png
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Full browser regression
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/cw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          QA_BASE='http://127.0.0.1:8000' node qa-guest.cjs
          QA_BASE='http://127.0.0.1:8000' node qa-itinerary.cjs
          QA_BASE='http://127.0.0.1:8000' node qa-stage.js
          QA_BASE='http://127.0.0.1:8000' node qa-ledger-v2.cjs
          QA_BASE='http://127.0.0.1:8000' node qa-ci.js
          QA_BASE='http://127.0.0.1:8000' node qa-avatar-interactions.cjs