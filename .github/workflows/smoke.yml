name: App smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check app-v4.js
      - name: Required files and links
        shell: bash
        run: |
          test -s index.html
          test -s app-v4.html
          test -s app-v4.css
          test -s app-v4.js
          test -s avatars.js
          grep -q 'app-v4.html' index.html
          grep -q 'app-v4.js' app-v4.html
          grep -q 'app-v4.css' app-v4.html
          ! grep -q 'dashboard.html' index.html
          ! grep -q 'leaflet' index.html
          ! grep -q 'road-routes.json' index.html
