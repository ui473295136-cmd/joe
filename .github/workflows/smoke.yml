name: App smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check app-v4.js
          node --check auth-guard.js
          node --check geo-throttle.js
          node --check time-compat-v1.js
          node --check driver-fun-v2.js
          node --check avatar-interactions-v1.js
          node --check avatar-interactions-qa-mock-v1.js
          node --check qa-avatar-interactions.cjs
          node --check trip-stage-v2.js
          node --check trip-stage-card-guard-v1.js
          node --check itinerary-header-sync-v1.js
          node --check qa-stage.js
          node --check ledger-v2.js
          node --check qa-ledger-v2.cjs
          node --check minimal-v1.js
          node --check profile-sync-v2.js
          node --check profile-upload-v3.js
          node --check admin-switch-v1.js
          node --check ledger-ack-v1.js
          node --check itinerary-live-v1.js
          node --check daily-card-v1.js
          node --check travel-assist-v1.js
          node --check travel-assist-dayfix-v1.js
          node --check map-state-guard-v1.js
          node --check social-v1.js
          node --check social-qa-mock-v1.js
          node --check map-v5.js
          node --check qa-mock.js
          node --check qa-probe.js
          node --check qa-ci.js
          node --check session-store.js
          node --check login.js
          node --check app-bootstrap.js
          node --check offline-v1.js
          node --check interaction-ux.js
      - name: Required files and links
        shell: bash
        run: |
          for f in index.html app-v4.html app-v4.css app-v4.js auth-guard.js geo-throttle.js time-compat-v1.js driver-fun-v2.js driver-fun-v2.css avatar-interactions-v1.js avatar-interactions-v1.css avatar-interactions-qa-mock-v1.js qa-avatar-interactions.cjs trip-stage-v2.js trip-stage-v2.css trip-stage-card-guard-v1.js itinerary-header-sync-v1.js qa-stage.js ledger-v2.js ledger-v2.css qa-ledger-v2.cjs minimal-v1.js minimal-v1.css profile-sync-v2.js profile-sync-v2.css profile-upload-v3.js admin-switch-v1.js ledger-ack-v1.js itinerary-live-v1.js itinerary-live-v1.css daily-card-v1.js daily-card-v1.css travel-assist-v1.js travel-assist-v1.css travel-assist-dayfix-v1.js map-state-guard-v1.js social-v1.js social-v1.css social-qa-mock-v1.js map-v5.js map-v5.css qa-mock.js qa-probe.js qa-ci.js avatars.js manifest.webmanifest icon.svg sw.js road-routes.json; do test -s "$f"; done
          for f in session-store.js login.js app-bootstrap.js offline-v1.js interaction-ux.js interaction-ux.css; do test -s "$f"; done
          grep -q 'trip-auth' session-store.js
          grep -q 'login.js' index.html
          grep -q 'auth-guard.js' app-v4.html
          grep -q 'app-bootstrap.js' app-v4.html
          grep -q 'app-v4.js' app-bootstrap.js
          grep -q 'map-v5.js' app-bootstrap.js
          grep -q 'offline-v1.js' app-bootstrap.js
          grep -q 'geo-throttle.js?v=6' app-bootstrap.js
          grep -q 'time-compat-v1.js' geo-throttle.js
          grep -q 'driver-fun-v2.js' geo-throttle.js
          grep -q 'avatar-interactions-v1.js' geo-throttle.js
          grep -q 'avatar-interactions-v1.css' geo-throttle.js
          grep -q 'avatar-interactions-qa-mock-v1.js' geo-throttle.js
          grep -q 'trip-stage-v2.js' geo-throttle.js
          grep -q 'trip-stage-card-guard-v1.js' geo-throttle.js
          grep -q 'trip-stage-v2.css' geo-throttle.js
          grep -q 'itinerary-header-sync-v1.js' geo-throttle.js
          grep -q 'ledger-v2.js' geo-throttle.js
          grep -q 'ledger-v2.css' geo-throttle.js
          grep -q 'profile-sync-v2.js' geo-throttle.js
          ! grep -q 'profile-upload-v3.js' geo-throttle.js
          grep -q 'admin-switch-v1.js' geo-throttle.js
          grep -q 'ledger-ack-v1.js' geo-throttle.js
          grep -q 'daily-card-v1.js' geo-throttle.js
          grep -q 'travel-assist-v1.js' geo-throttle.js
          grep -q 'travel-assist-dayfix-v1.js' geo-throttle.js
          grep -q 'map-state-guard-v1.js' geo-throttle.js
          grep -q 'social-qa-mock-v1.js' geo-throttle.js
          grep -q 'social-v1.js' geo-throttle.js
          ! grep -q 'decision-v2.js' geo-throttle.js
          ! grep -q 'ux-v6.js' geo-throttle.js
          ! grep -q 'dashboard.html' index.html
          grep -q 'navBadge' app-v4.html
          grep -q 'chuanxi-2026-v46-ledger' sw.js
          grep -q 'time-compat-v1.js' sw.js
          grep -q 'driver-fun-v2.js' sw.js
          grep -q 'avatar-interactions-v1.js' sw.js
          grep -q 'trip-stage-v2.js' sw.js
          grep -q 'trip-stage-card-guard-v1.js' sw.js
          grep -q 'itinerary-header-sync-v1.js' sw.js
          grep -q 'ledger-v2.js' sw.js
      - name: Session, API authorization and interaction regression
        run: npm ci --ignore-scripts && npm test
      - name: Production backend read checks
        shell: bash
        run: |
          for PERSON in '瑞子' '航子' '普子' '辉子'; do
            BODY=$(printf '{"trip_slug":"chuanxi2026","action":"status","payload":{"person":"%s"}}' "$PERSON")
            OUT=$(curl -fsS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-auth' -H 'content-type: application/json' --data "$BODY")
            echo "$OUT" | grep -q '"configured"'
          done
          for API in trip-profile trip-sync trip-trash; do
            STATUS=$(curl -sS --max-time 10 -o /tmp/cw-auth-check.json -w '%{http_code}' -X POST "https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/$API" -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{}}')
            test "$STATUS" = '401'
            grep -q 'session_invalid' /tmp/cw-auth-check.json
          done
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-assist' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-social' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
          curl -sS --max-time 10 -X POST 'https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/trip-interaction' -H 'content-type: application/json' --data '{"trip_slug":"chuanxi2026","action":"state","payload":{"person":"瑞子","token":"invalid"}}' | grep -q '登录已失效'
      - name: Map tile connectivity
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -A "$UA" -fL --max-time 8 -sS 'https://webrd01.is.autonavi.com/appmaptile?style=7&lang=zh_cn&size=1&scale=1&x=53990&y=24854&z=16' -o /tmp/amap.png
          A=$?
          curl -A "$UA" -fL --max-time 8 -sS 'https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/16/24854/53990' -o /tmp/geoq.png
          B=$?
          set -e
          if [ "$A" -ne 0 ] && [ "$B" -ne 0 ]; then echo 'Both map tile sources failed'; exit 1; fi
          test -s /tmp/amap.png || test -s /tmp/geoq.png
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Full four-identity browser regression
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/cw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          QA_BASE='http://127.0.0.1:8000' node qa-stage.js
          QA_BASE='http://127.0.0.1:8000' node qa-ledger-v2.cjs
          QA_BASE='http://127.0.0.1:8000' node qa-ci.js
          QA_BASE='http://127.0.0.1:8000' node qa-avatar-interactions.cjs