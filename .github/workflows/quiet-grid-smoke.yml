name: Quiet Grid Offboarding Check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/quiet-grid-smoke.yml"
      - "quiet-grid/index.html"
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check GitHub source shows only offline notice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("quiet-grid/index.html").read_text(encoding="utf8")
          assert "<h1>网页已下架</h1>" in html
          assert "该网页已停止提供服务。" in html
          assert "<script" not in html.lower()
          assert "grid-workbook" not in html
          print("PASS offline page replaced chat interface")
          PY
      - name: Check backend returns HTTP 410 for reads and messages
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          api="https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/grid-workbook"
          for method in ["GET","POST"]:
              req=urllib.request.Request(api,method=method,data=b'{"action":"poll"}' if method=="POST" else None,headers={"Content-Type":"application/json"})
              try:
                  urllib.request.urlopen(req,timeout=25)
                  raise AssertionError("Endpoint unexpectedly served "+method)
              except urllib.error.HTTPError as exc:
                  assert exc.code==410,(method,exc.code)
                  print("PASS backend disabled:",method,"410 Gone")
          PY
      - name: Check published GitHub Pages offline screen
        run: |
          python3 - <<'PY'
          import urllib.request,time
          url="https://ui473295136-cmd.github.io/joe/quiet-grid/"
          for attempt in range(12):
              with urllib.request.urlopen(url,timeout=25) as r:
                  html=r.read().decode("utf-8")
                  if "网页已下架" in html and "该网页已停止提供服务。" in html and "<script" not in html.lower():
                      print("PASS public page shows offline notice");break
              if attempt==11:raise AssertionError("GitHub Pages has not updated")
              time.sleep(10)
          PY