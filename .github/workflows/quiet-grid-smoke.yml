name: Quiet Grid Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/quiet-grid-smoke.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web source
        uses: actions/checkout@v4
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("quiet-grid/index.html").read_text(encoding="utf8")
          script=re.search(r"<script>\s*(.*?)\s*</script>",src,re.S)
          assert script, "Missing script"
          Path("/tmp/quiet-grid-app.js").write_text(script.group(1),encoding="utf8")
          PY
          node --check /tmp/quiet-grid-app.js
      - name: Verify live GitHub Pages URL
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, time
          url="https://ui473295136-cmd.github.io/joe/quiet-grid/"
          for attempt in range(6):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (deployment-check)"})
                  with urllib.request.urlopen(req,timeout=25) as res:
                      html=res.read().decode("utf-8")
                      assert res.status==200
                      assert "项目进度台账" in html, "Incorrect Pages content"
                      assert "协作记录" in html, "Chat UI missing"
                      assert "grid-workbook" in html, "Backend connection missing"
                      print("PASS: Published webpage at",url)
                      break
              except Exception as e:
                  if attempt==5: raise
                  print("Waiting for Github Pages:",str(e))
                  time.sleep(10)
          PY
      - name: Cloud chat create join send poll
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,base64,time
          u="https://wpfqcztbxxarsrruuuce.supabase.co/functions/v1/grid-workbook"
          def call(action,**kw):
              req=urllib.request.Request(u,data=json.dumps(dict(action=action,**kw)).encode(),headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=35) as r: return json.load(r)
          with urllib.request.urlopen(u+"?health=1",timeout=35) as r:
              health=json.load(r)
              assert health.get("ok"), health
          room=call("create",alias="TestA")
          assert len(room["roomCode"])==16
          guest=call("join",code=room["roomCode"],alias="TestB")
          assert room["memberId"]!=guest["memberId"]
          cipher=base64.b64encode(b"ci-encrypted-test-payload").decode()
          iv=base64.b64encode(b"123456789012").decode()
          sent=call("send",token=room["token"],ciphertext=cipher,iv=iv)
          feed=call("poll",token=guest["token"],after=0)
          assert any(x["id"]==sent["messageId"] for x in feed["messages"]),feed
          assert feed["day"]==health["day"]
          print("PASS: javascript syntax; function health; create; join; send; poll")
          PY