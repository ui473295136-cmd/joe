name: Assemble final travel dashboard
on:
  push:
    paths:
      - '.github/workflows/assemble-index.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html
        run: |
          cat .tmp/index.part1 .tmp/index.part2 .tmp/index.part3 .tmp/index.part4 .tmp/index.part5 .tmp/index.part6 > /tmp/index.b64
          base64 -d /tmp/index.b64 | gzip -d > index.html
          test "$(wc -c < index.html)" -eq 45163
          grep -q 'TEAM LEDGER' index.html
          grep -q '瑞子' index.html
          grep -q 'road-routes.json' index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add team ledger and real-road routes"
          git push
